name: Release

# Push a tag to publish a release:
#   v0.26.10.0     stable, offered to every HACS user
#   v0.26.10.1b1   beta (also b2, rc1, ...), a GitHub pre-release that HACS only
#                  offers to users who switch on "Show beta versions" for this repo
# The tag, minus the leading "v", must equal the version in manifest.json.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag matches the manifest
        run: |
          version=$(jq -r .version custom_components/thames_water_meter/manifest.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest version $version"
            exit 1
          fi
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          # A letter after the last number (b1, rc1, a1, dev1) marks a pre-release.
          if [[ "$GITHUB_REF_NAME" =~ [0-9](a|b|rc|dev)[0-9]*$ ]]; then
            flags="--prerelease"
          fi
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes $flags
