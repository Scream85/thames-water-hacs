name: Validate
on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          # The brands check passes because the integration ships brand/icon.png.
          category: integration
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # The oldest version Home Assistant itself supports.
          python-version: "3.13"
      - run: pip install -r requirements_test.txt
      # test_analysis, test_diag and test_structure are import-time scripts,
      # so pytest runs them when it collects them.
      - run: pytest
  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # Home Assistant itself comes with the test requirements, so mypy sees its types.
      - run: pip install -r requirements_dev.txt
      - run: mypy
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks scans the history, so it needs more than the tip.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure
