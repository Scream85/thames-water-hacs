version: 2
updates:
  # Keeps the workflow actions current, which would have caught the Node 20
  # deprecation warnings before GitHub started printing them.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # requirements_test.txt pins pytest-homeassistant-custom-component, which
  # decides the Home Assistant version the tests run against.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Every release after 0.13.316 needs Python 3.14. Remove this once CI, ruff
      # and mypy have moved to 3.14.
      - dependency-name: pytest-homeassistant-custom-component
