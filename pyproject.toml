[project]
name = "thames-water-service"
version = "1.0.0"
description = "Thames Water monitoring service with automated data collection, REST API, and dashboard"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",

    # Database
    "aiosqlite>=0.20.0",

    # Scheduler
    "apscheduler>=3.10.0",

    # Configuration
    "python-dotenv>=1.0.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",

    # HTTP client for notifications
    "httpx>=0.28.0",

    # Utilities
    "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
selenium = [
    "selenium>=4.27.0",
    "webdriver-manager>=4.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
