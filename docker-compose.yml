services:
  thames-water-service:
    build: .
    container_name: thames-water-service
    restart: unless-stopped
    hostname: thames-water-service

    # Run tini as PID 1 for clean signal forwarding and process reaping.
    init: true

    pids_limit: 200

    ports:
      - "127.0.0.1:8096:8096"

    volumes:
      # Database storage (persists between restarts)
      - ./data:/app/data

      # Service logs
      - ./logs:/app/logs

    # Secrets are loaded from .env via env_file rather than ${VAR} interpolation,
    # because Compose v2 double-interpolates the result of ${VAR} expansion. A
    # password containing literal $ characters then gets eaten as an undefined
    # variable reference and ends up empty in the container.
    env_file:
      - .env

    environment:
      - HOME=/tmp
      - PORT=8096
      - LOG_LEVEL=info
      - DB_PATH=/app/data/thames_water.db
      - SPIKE_THRESHOLD=800
      - INGEST_API_KEY=${INGEST_API_KEY:?INGEST_API_KEY must be set in .env}
      - SCRAPER_MODE=${SCRAPER_MODE:-external}

      # Scheduler configuration
      - DAILY_FETCH_HOUR=6
      - DAILY_FETCH_MINUTE=0
      - WEEKLY_VERIFY_DAY=sun
      - WEEKLY_VERIFY_HOUR=7

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8096/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
