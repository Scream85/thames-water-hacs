version: '3.8'

services:
  thames-water-service:
    build: .
    container_name: thames-water-service
    restart: unless-stopped
    hostname: thames-water-service

    ports:
      - "8096:8096"

    volumes:
      # Database storage (persists between restarts)
      - ./data:/app/data

      # Service logs
      - ./logs:/app/logs

    environment:
      - PORT=8096
      - LOG_LEVEL=info
      - DB_PATH=/app/data/thames_water.db
      - SPIKE_THRESHOLD=800
      - NOTIFICATION_EMAIL=${NOTIFICATION_EMAIL:-}
      - SERVICE_URL=${SERVICE_URL:-http://localhost:8096}

      # Thames Water credentials (from .env file)
      - THAMES_WATER_EMAIL=${THAMES_WATER_EMAIL}
      - THAMES_WATER_PASSWORD=${THAMES_WATER_PASSWORD}
      - THAMES_WATER_API_KEY=${THAMES_WATER_API_KEY}

      # SMTP configuration (optional)
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}

      # Scheduler configuration
      - DAILY_FETCH_HOUR=6
      - DAILY_FETCH_MINUTE=0
      - WEEKLY_VERIFY_DAY=sun
      - WEEKLY_VERIFY_HOUR=7

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8096/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
